syntax = "proto3";

package ecommerce.cart.v1;

import "common/v1/common.proto";

option go_package = "ecommerce.local/contracts/go/cart/v1;cartv1";
option java_multiple_files = true;
option java_package = "com.ecommerce.contracts.cart.v1";

service CartService {
  rpc GetCart(GetCartRequest) returns (GetCartResponse);
  rpc AddItem(AddItemRequest) returns (AddItemResponse);
  rpc UpdateItemQuantity(UpdateItemQuantityRequest) returns (UpdateItemQuantityResponse);
  rpc RemoveItem(RemoveItemRequest) returns (RemoveItemResponse);
  rpc ClearCart(ClearCartRequest) returns (ClearCartResponse);
  rpc GetFavorites(GetFavoritesRequest) returns (GetFavoritesResponse);
  rpc AddFavorite(AddFavoriteRequest) returns (AddFavoriteResponse);
  rpc RemoveFavorite(RemoveFavoriteRequest) returns (RemoveFavoriteResponse);
  rpc ClearFavorites(ClearFavoritesRequest) returns (ClearFavoritesResponse);
}

message GetCartRequest {
  string user_id = 1;
}

message AddItemRequest {
  string user_id = 1;
  string product_id = 2;
  string sku_id = 3;
  int32 quantity = 4;
}

message UpdateItemQuantityRequest {
  string user_id = 1;
  string item_id = 2;
  int32 quantity = 3;
}

message RemoveItemRequest {
  string user_id = 1;
  string item_id = 2;
}

message ClearCartRequest {
  string user_id = 1;
}

message Cart {
  repeated CartItem items = 1;
  bool degraded = 2;
}

message GetCartResponse {
  Cart cart = 1;
}

message AddItemResponse {
  Cart cart = 1;
}

message UpdateItemQuantityResponse {
  Cart cart = 1;
}

message RemoveItemResponse {
  Cart cart = 1;
}

message ClearCartResponse {
  Cart cart = 1;
}

message CartItem {
  string item_id = 1;
  string product_id = 2;
  string sku_id = 3;
  string variant_label = 4;
  string variant_color_hex = 5;
  int32 quantity = 6;
  string name = 7;
  string brand = 8;
  string category_name = 9;
  ecommerce.common.v1.Money unit_price = 10;
  ecommerce.common.v1.Money original_price = 11;
  string image_emoji = 12;
  repeated uint32 image_hue = 13;
  string image_url = 14;
  CartItemStatus status = 15;
  int32 available_quantity = 16;
}

enum CartItemStatus {
  CART_ITEM_STATUS_UNSPECIFIED = 0;
  CART_ITEM_STATUS_AVAILABLE = 1;
  CART_ITEM_STATUS_LIMITED = 2;
  CART_ITEM_STATUS_OUT_OF_STOCK = 3;
  CART_ITEM_STATUS_UNAVAILABLE = 4;
}

message GetFavoritesRequest {
  string user_id = 1;
}

message GetFavoritesResponse {
  FavoriteList favorites = 1;
}

message AddFavoriteRequest {
  string user_id = 1;
  string product_id = 2;
}

message AddFavoriteResponse {
  FavoriteList favorites = 1;
}

message RemoveFavoriteRequest {
  string user_id = 1;
  string product_id = 2;
}

message RemoveFavoriteResponse {
  FavoriteList favorites = 1;
}

message ClearFavoritesRequest {
  string user_id = 1;
}

message ClearFavoritesResponse {
  FavoriteList favorites = 1;
}

message FavoriteList {
  repeated FavoriteItem items = 1;
  bool degraded = 2;
}

message FavoriteVariant {
  string sku_id = 1;
  string label = 2;
  string color_hex = 3;
  ecommerce.common.v1.Money price = 4;
  ecommerce.common.v1.Money original_price = 5;
}

message FavoriteItem {
  string item_id = 1;
  string product_id = 2;
  string name = 3;
  string brand = 4;
  string category_id = 5;
  string category_name = 6;
  ecommerce.common.v1.Money price = 7;
  ecommerce.common.v1.Money original_price = 8;
  double rating = 9;
  int64 review_count = 10;
  int64 sold_count = 11;
  string image_url = 12;
  string image_emoji = 13;
  repeated uint32 image_hue = 14;
  string badge = 15;
  repeated FavoriteVariant variants = 16;
  FavoriteItemStatus status = 17;
  int32 available_quantity = 18;
  ecommerce.common.v1.Money max_price = 19;
}

enum FavoriteItemStatus {
  FAVORITE_ITEM_STATUS_UNSPECIFIED = 0;
  FAVORITE_ITEM_STATUS_AVAILABLE = 1;
  FAVORITE_ITEM_STATUS_LIMITED = 2;
  FAVORITE_ITEM_STATUS_OUT_OF_STOCK = 3;
  FAVORITE_ITEM_STATUS_UNAVAILABLE = 4;
  FAVORITE_ITEM_STATUS_UNKNOWN = 5;
}
