syntax = "proto3";

package ecommerce.catalog.v1;

import "common/v1/common.proto";

option go_package = "ecommerce.local/contracts/go/catalog/v1;catalogv1";
option java_multiple_files = true;
option java_package = "com.ecommerce.contracts.catalog.v1";

service CatalogService {
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);
  rpc SoftDeleteProduct(SoftDeleteProductRequest) returns (SoftDeleteProductResponse);
  rpc ListAdminProducts(ListAdminProductsRequest) returns (ListAdminProductsResponse);
  rpc ListInventoryCatalogItems(ListInventoryCatalogItemsRequest) returns (ListInventoryCatalogItemsResponse);
  rpc GetAdminProduct(GetAdminProductRequest) returns (GetAdminProductResponse);
  rpc CreateProduct(CreateProductRequest) returns (CreateProductResponse);
  rpc UpdateProduct(UpdateProductRequest) returns (UpdateProductResponse);
  rpc CreateProductMediaUpload(CreateProductMediaUploadRequest) returns (CreateProductMediaUploadResponse);
  rpc ListProductReviews(ListProductReviewsRequest) returns (ListProductReviewsResponse);
  rpc GetReviewEligibility(GetReviewEligibilityRequest) returns (GetReviewEligibilityResponse);
  rpc CreateProductReview(CreateProductReviewRequest) returns (CreateProductReviewResponse);
  rpc UpdateProductReview(UpdateProductReviewRequest) returns (UpdateProductReviewResponse);
  rpc DeleteProductReview(DeleteProductReviewRequest) returns (DeleteProductReviewResponse);
  rpc CreateReviewMediaUpload(CreateReviewMediaUploadRequest) returns (CreateReviewMediaUploadResponse);
  rpc ListAdminReviews(ListAdminReviewsRequest) returns (ListAdminReviewsResponse);
  rpc SetReviewVisibility(SetReviewVisibilityRequest) returns (SetReviewVisibilityResponse);
  rpc ReplyProductReview(ReplyProductReviewRequest) returns (ReplyProductReviewResponse);
}

message GetProductRequest {
  string id = 1;
}

message GetProductResponse {
  string id = 1;
  string name = 2;
  string description = 3;
  ecommerce.common.v1.Money price = 4;
  string short_description = 5;
  string brand = 6;
  string category_id = 7;
  string category_name = 8;
  ecommerce.common.v1.Money original_price = 9;
  repeated string images = 10;
  double rating = 11;
  int64 review_count = 12;
  int64 sold_count = 13;
  bool is_new = 14;
  string badge = 15;
  bool featured = 16;
  string emoji = 17;
  repeated uint32 image_hue = 18;
  repeated ProductVariant variants = 19;
  repeated string details = 20;
  bool deleted = 21;
  repeated string videos = 22;
  ecommerce.common.v1.Money max_price = 23;
  int64 version = 24;
}

message ProductVariant {
  string sku_id = 1;
  string label = 2;
  string color_hex = 3;
  ecommerce.common.v1.Money price = 4;
  ecommerce.common.v1.Money original_price = 5;
}

message SoftDeleteProductRequest {
  string id = 1;
  bool deleted = 2;
  string user_id = 3;
}

message SoftDeleteProductResponse {
  string id = 1;
  bool deleted = 2;
}

message ProductSummary {
  string id = 1;
  string name = 2;
  string brand = 3;
  string category_id = 4;
  string category_name = 5;
  ecommerce.common.v1.Money price = 6;
  ecommerce.common.v1.Money original_price = 7;
  repeated string images = 8;
  double rating = 9;
  int64 review_count = 10;
  int64 sold_count = 11;
  bool is_new = 12;
  string badge = 13;
  bool featured = 14;
  string emoji = 15;
  repeated uint32 image_hue = 16;
  ecommerce.common.v1.Money max_price = 17;
  repeated string sku_ids = 18;
  int64 version = 19;
}

message SearchProductsRequest {
  string query = 1;
  string category_id = 2;
  // One of: pho-bien, gia-thap, gia-cao, moi-nhat, danh-gia. Empty means
  // default popularity ordering.
  string sort = 3;
  // Price bounds in the smallest currency unit (VND). Zero means unset.
  int64 price_min = 4;
  int64 price_max = 5;
  bool on_sale = 6;
  int32 rating_min = 7;
  int32 page = 8;
  int32 page_size = 9;
}

message SearchProductsResponse {
  repeated ProductSummary items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total_items = 4;
  int32 total_pages = 5;
}

message AdminProductSummary {
  string id = 1;
  string name = 2;
  string brand = 3;
  string category_id = 4;
  string category_name = 5;
  ecommerce.common.v1.Money price = 6;
  ecommerce.common.v1.Money original_price = 7;
  repeated string images = 8;
  double rating = 9;
  int64 review_count = 10;
  int64 sold_count = 11;
  bool is_new = 12;
  string badge = 13;
  bool featured = 14;
  string emoji = 15;
  repeated uint32 image_hue = 16;
  bool deleted = 17;
  int32 variant_count = 18;
  string created_at = 19;
  string updated_at = 20;
  int32 video_count = 21;
  ecommerce.common.v1.Money max_price = 22;
  repeated string sku_ids = 23;
  int64 version = 24;
}

message CategoryMetric {
  string category_id = 1;
  string category_name = 2;
  int64 active_product_count = 3;
}

message InventoryCatalogItem {
  string id = 1;
  string name = 2;
  string brand = 3;
  string category_id = 4;
  string category_name = 5;
  string image_url = 6;
  string emoji = 7;
  repeated uint32 image_hue = 8;
  bool deleted = 9;
  repeated ProductVariant variants = 10;
}

message ListAdminProductsRequest {
  string user_id = 1;
  string query = 2;
  string category_id = 3;
  string status = 4;
  string sort = 5;
  int32 page = 6;
  int32 page_size = 7;
}

message ListAdminProductsResponse {
  repeated AdminProductSummary items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total_items = 4;
  int32 total_pages = 5;
  int64 active_count = 6;
  int64 deleted_count = 7;
  repeated CategoryMetric categories = 8;
}

message ListInventoryCatalogItemsRequest {
  string user_id = 1;
  string query = 2;
  string category_id = 3;
  bool include_deleted = 4;
}

message ListInventoryCatalogItemsResponse {
  repeated InventoryCatalogItem items = 1;
}

message GetAdminProductRequest {
  string id = 1;
  string user_id = 2;
}

message GetAdminProductResponse {
  GetProductResponse product = 1;
}

message CreateProductResponse {
  GetProductResponse product = 1;
}

message UpdateProductResponse {
  GetProductResponse product = 1;
}

message CreateProductMediaUploadRequest {
  string user_id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
}

message CreateProductMediaUploadResponse {
  string upload_id = 1;
  string media_type = 2;
  string upload_url = 3;
  string public_url = 4;
  string object_key = 5;
  int32 expires_in_seconds = 6;
}

message CreateProductRequest {
  string user_id = 1;
  string id = 2;
  string name = 3;
  string short_description = 4;
  string description = 5;
  string brand = 6;
  string category_id = 7;
  string category_name = 8;
  repeated string images = 9;
  bool is_new = 10;
  string badge = 11;
  bool featured = 12;
  string emoji = 13;
  repeated uint32 image_hue = 14;
  repeated ProductVariant variants = 15;
  repeated string details = 16;
  repeated string videos = 17;
}

message UpdateProductRequest {
  string user_id = 1;
  string id = 2;
  string name = 3;
  string short_description = 4;
  string description = 5;
  string brand = 6;
  string category_id = 7;
  string category_name = 8;
  repeated string images = 9;
  bool is_new = 10;
  string badge = 11;
  bool featured = 12;
  string emoji = 13;
  repeated uint32 image_hue = 14;
  repeated ProductVariant variants = 15;
  repeated string details = 16;
  repeated string videos = 17;
}

message ProductReview {
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  string user_id = 4;
  string order_id = 5;
  string sku_id = 6;
  string variant_label = 7;
  string author_name = 8;
  int32 rating = 9;
  string comment = 10;
  repeated string images = 11;
  bool verified_purchase = 12;
  bool hidden = 13;
  string hidden_reason = 14;
  string admin_reply = 15;
  string admin_replied_at = 16;
  string created_at = 17;
  string updated_at = 18;
}

message RatingBreakdown {
  int32 rating = 1;
  int64 count = 2;
}

message ReviewRatingSummary {
  double average_rating = 1;
  int64 total_reviews = 2;
  repeated RatingBreakdown breakdown = 3;
}

message ListProductReviewsRequest {
  string product_id = 1;
  int32 rating = 2;
  bool has_images = 3;
  string sort = 4;
  int32 page = 5;
  int32 page_size = 6;
}

message ListProductReviewsResponse {
  repeated ProductReview items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total_items = 4;
  int32 total_pages = 5;
  ReviewRatingSummary summary = 6;
}

message EligibleReviewOrder {
  string order_id = 1;
  string order_code = 2;
  string sku_id = 3;
  string variant_label = 4;
  string delivered_at = 5;
  bool reviewed = 6;
  string review_id = 7;
}

message GetReviewEligibilityRequest {
  string user_id = 1;
  string product_id = 2;
}

message GetReviewEligibilityResponse {
  bool can_review = 1;
  repeated EligibleReviewOrder eligible_orders = 2;
  repeated ProductReview my_reviews = 3;
}

message CreateProductReviewRequest {
  string user_id = 1;
  string product_id = 2;
  string order_id = 3;
  string author_name = 4;
  int32 rating = 5;
  string comment = 6;
  repeated string images = 7;
}

message CreateProductReviewResponse {
  ProductReview review = 1;
  ReviewRatingSummary summary = 2;
}

message UpdateProductReviewRequest {
  string user_id = 1;
  string review_id = 2;
  int32 rating = 3;
  string comment = 4;
  repeated string images = 5;
}

message UpdateProductReviewResponse {
  ProductReview review = 1;
  ReviewRatingSummary summary = 2;
}

message DeleteProductReviewRequest {
  string user_id = 1;
  string review_id = 2;
}

message DeleteProductReviewResponse {
  string review_id = 1;
  string product_id = 2;
  ReviewRatingSummary summary = 3;
}

message CreateReviewMediaUploadRequest {
  string user_id = 1;
  string filename = 2;
  string content_type = 3;
  int64 size_bytes = 4;
}

message CreateReviewMediaUploadResponse {
  string upload_id = 1;
  string media_type = 2;
  string upload_url = 3;
  string public_url = 4;
  string object_key = 5;
  int32 expires_in_seconds = 6;
}

message ListAdminReviewsRequest {
  string user_id = 1;
  string query = 2;
  string product_id = 3;
  int32 rating = 4;
  string status = 5;
  string reply_status = 6;
  int32 page = 7;
  int32 page_size = 8;
}

message ListAdminReviewsResponse {
  repeated ProductReview items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total_items = 4;
  int32 total_pages = 5;
  int64 visible_count = 6;
  int64 hidden_count = 7;
  int64 unreplied_count = 8;
  double average_rating = 9;
}

message SetReviewVisibilityRequest {
  string user_id = 1;
  string review_id = 2;
  bool hidden = 3;
  string reason = 4;
}

message SetReviewVisibilityResponse {
  ProductReview review = 1;
}

message ReplyProductReviewRequest {
  string user_id = 1;
  string review_id = 2;
  string reply = 3;
}

message ReplyProductReviewResponse {
  ProductReview review = 1;
}
