syntax = "proto3";

package ecommerce.order.v1;

import "common/v1/common.proto";

option go_package = "ecommerce.local/contracts/go/order/v1;orderv1";
option java_multiple_files = true;
option java_package = "com.ecommerce.contracts.order.v1";

service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (CreateOrderResponse);
  rpc GetOrder(GetOrderRequest) returns (GetOrderResponse);
  rpc ListOrders(ListOrdersRequest) returns (ListOrdersResponse);
  rpc CancelOrder(CancelOrderRequest) returns (CancelOrderResponse);
  rpc AdminListOrders(AdminListOrdersRequest) returns (AdminListOrdersResponse);
  rpc AdminGetOrder(AdminGetOrderRequest) returns (AdminGetOrderResponse);
  rpc AdminUpdateOrderStatus(AdminUpdateOrderStatusRequest) returns (AdminUpdateOrderStatusResponse);
  rpc AdminRetryRefund(AdminRetryRefundRequest) returns (AdminRetryRefundResponse);
}

message ShippingAddressSnapshot {
  string recipient_name = 1;
  string phone = 2;
  string province_code = 3;
  string province_name = 4;
  string ward_code = 5;
  string ward_name = 6;
  string address_line = 7;
  string label = 8;
}

message OrderItem {
  string product_id = 1;
  string sku_id = 2;
  int32 quantity = 3;
  ecommerce.common.v1.Money unit_price = 4;
  string cart_item_id = 5;
  string variant_label = 6;
  string expected_name = 7;
  int64 expected_product_version = 8;
  string variant_color_hex = 9;
  string image_url = 10;
  string brand = 11;
  string category_name = 12;
  string image_emoji = 13;
  repeated uint32 image_hue = 14;
  ecommerce.common.v1.Money line_total = 15;
}

message CreateOrderRequest {
  string user_id = 1;
  repeated OrderItem items = 2;
  string idempotency_key = 3;
  ShippingAddressSnapshot shipping_address = 4;
  string payment_method = 5;
  string note = 6;
}

message OrderDetail {
  string order_id = 1;
  string order_code = 2;
  string user_id = 3;
  string status = 4;
  string payment_method = 5;
  string payment_status = 6;
  ShippingAddressSnapshot shipping_address = 7;
  repeated OrderItem items = 8;
  ecommerce.common.v1.Money subtotal = 9;
  ecommerce.common.v1.Money shipping_fee = 10;
  ecommerce.common.v1.Money total_amount = 11;
  string note = 12;
  string pay_url = 13;
  string cancel_reason = 14;
  string payment_expires_at = 15;
  string created_at = 16;
  string updated_at = 17;
  // Populated only by single-order reads; list responses leave it empty.
  repeated OrderStatusChange status_history = 18;
  string auto_confirm_at = 19;
  string shipping_carrier = 20;
  string tracking_number = 21;
  string refund_trans_id = 22;
  // Admin-only fields: omitted (empty) on shopper-facing GetOrder / ListOrders responses.
  string refund_last_error = 23;
  string refunded_at = 24;
  string refund_actor_type = 25;
  string refund_reason = 26;
}

message OrderStatusChange {
  // Empty for the entry that records order creation.
  string from_status = 1;
  string to_status = 2;
  // SYSTEM, CUSTOMER or ADMIN.
  string actor_type = 3;
  string reason = 4;
  string shipping_carrier = 5;
  string tracking_number = 6;
  string created_at = 7;
}

message CreateOrderResponse {
  string order_id = 1;
  string status = 2;
  ecommerce.common.v1.Money total_amount = 3;
  OrderDetail order = 4;
  string pay_url = 5;
}

message GetOrderRequest {
  string user_id = 1;
  string order_id = 2;
}

message GetOrderResponse {
  OrderDetail order = 1;
}

message ListOrdersRequest {
  string user_id = 1;
  string status = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message ListOrdersResponse {
  repeated OrderDetail items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total_items = 4;
  int32 total_pages = 5;
}

message CancelOrderRequest {
  string user_id = 1;
  string order_id = 2;
  string reason = 3;
}

message CancelOrderResponse {
  OrderDetail order = 1;
}

message AdminListOrdersRequest {
  // Calling administrator.
  string user_id = 1;
  // Empty lists every status.
  string status = 2;
  // Case-insensitive order code prefix.
  string query = 3;
  int32 page = 4;
  int32 page_size = 5;
}

message AdminListOrdersResponse {
  repeated OrderDetail items = 1;
  int32 page = 2;
  int32 page_size = 3;
  int64 total_items = 4;
  int32 total_pages = 5;
  // Order count per status for the same query, ignoring the status filter.
  map<string, int64> status_counts = 6;
}

message AdminGetOrderRequest {
  string user_id = 1;
  string order_id = 2;
}

message AdminGetOrderResponse {
  OrderDetail order = 1;
  repeated string allowed_next_statuses = 2;
}

message AdminUpdateOrderStatusRequest {
  string user_id = 1;
  string order_id = 2;
  // Rejects the update when the order is no longer in this status.
  string expected_status = 3;
  string target_status = 4;
  string reason = 5;
  string shipping_carrier = 6;
  string tracking_number = 7;
}

message AdminUpdateOrderStatusResponse {
  OrderDetail order = 1;
  repeated string allowed_next_statuses = 2;
}

message AdminRetryRefundRequest {
  string user_id = 1;
  string order_id = 2;
  string reason = 3;
}

message AdminRetryRefundResponse {
  OrderDetail order = 1;
  repeated string allowed_next_statuses = 2;
}
