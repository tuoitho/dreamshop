_format_version: "3.0"

services:
  - name: identity-service
    url: http://identity-service:8080
    routes:
      - name: identity-auth-public
        paths:
          - "~/api/v1/auth/register$"
          - "~/api/v1/auth/login$"
          - "~/api/v1/auth/refresh$"
          - "~/api/v1/auth/logout$"
        methods: ["POST"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
      - name: identity-auth-jwks
        paths: ['~/api/v1/auth/\.well-known/jwks\.json$']
        methods: ["GET"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
      - name: identity-protected
        paths:
          - "/api/v1/users"
          - "/api/v1/locations"
          - "/api/v1/admin/users"
          - "/api/v1/admin/rbac"
        methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: bff-service
    url: http://bff-service:8080
    routes:
      - name: storefront-api
        paths: ["/api/v1/storefront/products"]
        methods: ["GET"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
      - name: cart-api
        paths: ["/api/v1/cart"]
        methods: ["GET", "POST", "PATCH", "DELETE"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api
      - name: admin-products-api
        paths: ["/api/v1/admin/products"]
        methods: ["POST"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: ecommerce-fe
    url: http://ecommerce-fe:8080
    routes:
      - name: frontend-spa
        paths: ["/"]
        methods: ["GET", "HEAD"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
