_format_version: "3.0"

services:
  - name: identity-auth-register
    url: http://identity-service:8080/register
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - X-User-Id
              - X-User-Roles
    routes:
      - name: identity-auth-register
        paths: ["~/api/v1/auth/register$"]
        methods: ["POST"]
        strip_path: true

  - name: identity-auth-login
    url: http://identity-service:8080/login
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - X-User-Id
              - X-User-Roles
    routes:
      - name: identity-auth-login
        paths: ["~/api/v1/auth/login$"]
        methods: ["POST"]
        strip_path: true

  - name: identity-auth-refresh
    url: http://identity-service:8080/refresh
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - X-User-Id
              - X-User-Roles
    routes:
      - name: identity-auth-refresh
        paths: ["~/api/v1/auth/refresh$"]
        methods: ["POST"]
        strip_path: true

  - name: identity-auth-logout
    url: http://identity-service:8080/logout
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - X-User-Id
              - X-User-Roles
    routes:
      - name: identity-auth-logout
        paths: ["~/api/v1/auth/logout$"]
        methods: ["POST"]
        strip_path: true

  - name: identity-auth-jwks
    url: http://identity-service:8080/.well-known/jwks.json
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - X-User-Id
              - X-User-Roles
    routes:
      - name: identity-auth-jwks
        paths: ['~/api/v1/auth/\.well-known/jwks\.json$']
        methods: ["GET"]
        strip_path: true

  - name: identity-users
    url: http://identity-service:8080/users
    routes:
      - name: identity-users-protected
        paths: ["/api/v1/users"]
        methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
        strip_path: true
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: identity-locations
    url: http://identity-service:8080/locations
    routes:
      - name: identity-locations-protected
        paths: ["/api/v1/locations"]
        methods: ["GET"]
        strip_path: true
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: identity-admin-users
    url: http://identity-service:8080/admin/users
    routes:
      - name: identity-admin-users-protected
        paths: ["/api/v1/admin/users"]
        methods: ["GET", "PATCH", "PUT", "DELETE"]
        strip_path: true
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: identity-admin-rbac
    url: http://identity-service:8080/admin/rbac
    routes:
      - name: identity-admin-rbac-protected
        paths: ["/api/v1/admin/rbac"]
        methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
        strip_path: true
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: bff-service
    url: http://bff-service:8080
    routes:
      - name: cart-api
        paths: ["/api/v1/cart"]
        methods: ["GET", "DELETE"]
        strip_path: true
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: bff-cart-items
    url: http://bff-service:8080/items
    routes:
      - name: cart-items-api
        paths: ["/api/v1/cart/items"]
        methods: ["POST", "PATCH", "DELETE"]
        strip_path: true
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: bff-admin-products
    url: http://bff-service:8080/products
    routes:
      - name: admin-products-api
        paths: ["/api/v1/admin/products"]
        methods: ["POST"]
        strip_path: true
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: bff-storefront
    url: http://bff-service:8080/products
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - X-User-Id
              - X-User-Roles
    routes:
      - name: storefront-api
        paths: ["/api/v1/storefront/products"]
        methods: ["GET"]
        strip_path: true

  - name: ecommerce-fe
    url: http://ecommerce-fe:8080
    plugins:
      - name: request-transformer
        config:
          remove:
            headers:
              - X-User-Id
              - X-User-Roles
    routes:
      - name: frontend-spa
        paths: ["/"]
        methods: ["GET", "HEAD"]
        strip_path: false
