_format_version: "3.0"

services:
  - name: identity-service
    url: http://identity-service:8080
    routes:
      - name: identity-auth-public
        paths:
          - "~/api/v1/auth/register$"
          - "~/api/v1/auth/login$"
          - "~/api/v1/auth/refresh$"
          - "~/api/v1/auth/logout$"
        methods: ["POST"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
      - name: identity-auth-jwks
        paths: ['~/api/v1/auth/\.well-known/jwks\.json$']
        methods: ["GET"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
      - name: identity-protected
        paths:
          - "/api/v1/users"
          - "/api/v1/locations"
          - "/api/v1/admin/users"
          - "/api/v1/admin/rbac"
        methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: bff-service
    url: http://bff-service:8080
    routes:
      - name: storefront-api
        paths: ["/api/v1/storefront/products"]
        methods: ["GET"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
      - name: cart-api
        paths: ["/api/v1/cart"]
        methods: ["GET", "POST", "PATCH", "DELETE"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api
      - name: favorites-api
        paths: ["/api/v1/favorites"]
        methods: ["GET", "POST", "DELETE"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api
      - name: orders-api
        paths: ["/api/v1/orders"]
        methods: ["GET", "POST"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api
      - name: payments-momo-public
        paths:
          - "~/api/v1/payments/momo-redirect$"
          - "~/api/v1/payments/momo-ipn$"
        methods: ["GET", "POST"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
      - name: admin-products-api
        paths: ["/api/v1/admin/products"]
        methods: ["GET", "POST", "PUT", "PATCH", "DELETE"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api
      - name: admin-inventory-api
        paths: ["/api/v1/admin/inventory"]
        methods: ["GET", "POST", "PUT", "PATCH"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api
      - name: admin-orders-api
        paths: ["/api/v1/admin/orders"]
        methods: ["GET", "POST"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://identity-service:8080/.well-known/jwks.json
              issuer: http://identity-service:8080
              audience: ecommerce-api

  - name: minio
    url: http://minio:9000
    routes:
      - name: product-media-storage
        paths: ["/product-media"]
        methods: ["GET", "HEAD", "PUT"]
        strip_path: false
        preserve_host: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
          - name: request-size-limiting
            config:
              allowed_payload_size: 32
              size_unit: megabytes

  - name: admin-fe
    url: http://admin-fe:8080
    routes:
      - name: admin-spa
        paths: ["/admin"]
        methods: ["GET", "HEAD"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles

  - name: ecommerce-fe
    url: http://ecommerce-fe:8080
    routes:
      - name: frontend-spa
        paths: ["/"]
        methods: ["GET", "HEAD"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
