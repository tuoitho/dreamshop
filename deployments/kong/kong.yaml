_format_version: "3.0"
services:
  - name: identity-service
    url: http://identity-service:8080
    routes:
      - name: identity-public
        paths: ["/api/v1/auth", "/api/v1/users"]
        strip_path: true
  - name: bff-service
    url: http://bff-service:8080
    routes:
      - name: storefront-api
        paths: ["/api/v1/storefront"]
        strip_path: true
