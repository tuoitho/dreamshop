_format_version: "3.0"
# CORS plugin global cho phép frontend dev (localhost:5173) gọi API qua gateway.
services:
  - name: identity-service
    url: http://identity-service:8080
    routes:
      - name: identity-public
        paths: ["/api/v1/auth", "/api/v1/users"]
        strip_path: true
  - name: bff-service
    url: http://bff-service:8080
    routes:
      - name: storefront-api
        paths: ["/api/v1/storefront"]
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      max_age: 3600
      credentials: true
