_format_version: "3.0"
# CORS plugin global cho phép frontend dev (localhost:5173) gọi API qua gateway.
services:
  - name: identity-service
    url: http://host.docker.internal:8080
    routes:
      - name: identity-auth-public
        paths: ["/api/v1/auth"]
        strip_path: true
      - name: identity-users-protected
        paths: ["/api/v1"]
        strip_path: true
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
              issuer: http://localhost:8080
              audience: ecommerce-api
  - name: bff-service
    url: http://host.docker.internal:8081
    routes:
      - name: cart-api
        paths: ["/api/v1/cart"]
        strip_path: true
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
              issuer: http://localhost:8080
              audience: ecommerce-api
      - name: admin-products-api
        paths: ["/api/v1/admin"]
        strip_path: true
      - name: storefront-api
        paths: ["/api/v1/storefront"]
        strip_path: true

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      max_age: 3600
      credentials: true
