_format_version: "3.0"
# CORS plugin global cho phép frontend dev (localhost:5173 và localhost:5174) gọi API qua gateway.
services:
  - name: identity-service
    url: http://host.docker.internal:8080
    routes:
      - name: identity-auth-public
        paths: ["/api/v1/auth"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
      - name: identity-protected
        paths:
          - "/api/v1/users"
          - "/api/v1/locations"
          - "/api/v1/admin/users"
          - "/api/v1/admin/rbac"
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
              issuer: http://localhost:8080
              audience: ecommerce-api

  - name: bff-service
    url: http://host.docker.internal:8081
    routes:
      - name: storefront-api
        paths: ["/api/v1/storefront/products"]
        strip_path: false
        plugins:
          - name: request-transformer
            config:
              remove:
                headers:
                  - X-User-Id
                  - X-User-Roles
      - name: cart-api
        paths: ["/api/v1/cart"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
              issuer: http://localhost:8080
              audience: ecommerce-api
      - name: favorites-api
        paths: ["/api/v1/favorites"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
              issuer: http://localhost:8080
              audience: ecommerce-api
      - name: admin-products-api
        paths: ["/api/v1/admin/products"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
              issuer: http://localhost:8080
              audience: ecommerce-api
      - name: admin-inventory-api
        paths: ["/api/v1/admin/inventory"]
        strip_path: false
        plugins:
          - name: caller-context
            config:
              jwks_uri: http://host.docker.internal:8080/.well-known/jwks.json
              issuer: http://localhost:8080
              audience: ecommerce-api

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:5173"
        - "http://localhost:5174"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Authorization
        - Content-Type
      exposed_headers:
        - Authorization
      max_age: 3600
      credentials: true
