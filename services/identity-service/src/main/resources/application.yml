server:
  port: ${SERVER_PORT:8080}
spring:
  datasource:
    url: ${IDENTITY_DB_URL:jdbc:postgresql://localhost:5432/identity_db}
    username: ${IDENTITY_DB_USERNAME:ecommerce}
    password: ${IDENTITY_DB_PASSWORD:change-me-local-only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
identity:
  bootstrap:
    super-admin:
      email: ${IDENTITY_BOOTSTRAP_SUPER_ADMIN_EMAIL:admin@example.com}
      password: ${IDENTITY_BOOTSTRAP_SUPER_ADMIN_PASSWORD:AdminPassword123!}
      full-name: ${IDENTITY_BOOTSTRAP_SUPER_ADMIN_FULL_NAME:Administrator}
  grpc:
    host: ${IDENTITY_GRPC_HOST:127.0.0.1}
    port: ${IDENTITY_GRPC_PORT:50054}
    shutdown-grace: ${IDENTITY_GRPC_SHUTDOWN_GRACE:5s}
  jwt:
    issuer: ${IDENTITY_JWT_ISSUER:http://localhost:8080}
    audience: ${IDENTITY_JWT_AUDIENCE:ecommerce-api}
    private-key-path: ${IDENTITY_JWT_PRIVATE_KEY_PATH:deployments/secrets/identity/private.pem}
    public-key-path: ${IDENTITY_JWT_PUBLIC_KEY_PATH:deployments/secrets/identity/public.pem}
    key-id: ${IDENTITY_JWT_KEY_ID:identity-dev-2026-01}
    access-ttl: ${IDENTITY_JWT_ACCESS_TTL:15m}
  session:
    refresh-ttl: ${IDENTITY_SESSION_REFRESH_TTL:30d}
    cookie-name: ${IDENTITY_SESSION_COOKIE_NAME:refresh_token}
    cookie-path: ${IDENTITY_SESSION_COOKIE_PATH:/api/v1/auth}
    admin-cookie-name: ${IDENTITY_SESSION_ADMIN_COOKIE_NAME:admin_refresh_token}
    admin-cookie-path: ${IDENTITY_SESSION_ADMIN_COOKIE_PATH:/api/v1/auth/admin}
    cookie-secure: ${IDENTITY_SESSION_COOKIE_SECURE:false}
management:
  server:
    port: ${MANAGEMENT_SERVER_PORT:8090}
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level trace_id=%X{trace_id:-none} [%thread] %logger{36} - %msg%n"
