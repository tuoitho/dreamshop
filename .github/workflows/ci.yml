name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
      - name: Validate pull-request title
        run: go run ./scripts/validate-pr-title -title "$PR_TITLE"
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

  boundaries:
    name: Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
      - name: Check service boundaries
        run: go run ./scripts/check-boundaries

  contracts:
    name: Contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: bufbuild/buf-setup-action@v1
      - name: Check protobuf formatting
        run: buf format --diff --exit-code
      - name: Lint protobuf contracts
        run: buf lint
      - name: Check protobuf breaking changes against main
        run: buf breaking --against ".git#ref=refs/remotes/origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
      - name: Generate contract modules
        run: buf generate
      - name: Verify generated contract modules are synchronized
        shell: bash
        run: |
          git diff --exit-code -- contracts/go contracts/java/src/main/generated
          test -z "$(git ls-files --others --exclude-standard -- contracts/go contracts/java/src/main/generated)"

  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: bufbuild/buf-setup-action@v1
      - name: Generate contract modules
        run: buf generate
      - name: Verify Java services
        run: mvn --batch-mode --no-transfer-progress verify

  go:
    name: Go
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ci-test-only-password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ecommerce -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24.x'
          cache: true
          cache-dependency-path: |
            go.work.sum
            contracts/go/go.sum
            services/bff-service/go.sum
            services/catalog-service/go.sum
            services/inventory-service/go.sum
            services/cart-service/go.sum
      - uses: bufbuild/buf-setup-action@v1
      - name: Generate contract modules
        run: buf generate
      - name: Initialize Go test databases
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U ecommerce -d postgres -v ON_ERROR_STOP=1 < deployments/postgres/init/01-create-databases.sql
      - name: Test Go services and scripts
        run: |
          go test ./scripts/... ./services/bff-service/...
          DATABASE_URL="postgres://ecommerce:ci-test-only-password@127.0.0.1:5432/catalog_db?sslmode=disable" go test -count=1 ./services/catalog-service/...
          DATABASE_URL="postgres://ecommerce:ci-test-only-password@127.0.0.1:5432/inventory_db?sslmode=disable" go test -count=1 ./services/inventory-service/...
          DATABASE_URL="postgres://ecommerce:ci-test-only-password@127.0.0.1:5432/cart_db?sslmode=disable" go test -count=1 ./services/cart-service/...
      - name: Build Go services and scripts
        run: go build ./scripts/... ./services/bff-service/... ./services/catalog-service/... ./services/inventory-service/... ./services/cart-service/...

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: ecommerce-fe/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
        working-directory: ecommerce-fe
      - name: Test frontend
        run: npm test
        working-directory: ecommerce-fe
      - name: Lint frontend
        run: npm run lint
        working-directory: ecommerce-fe
      - name: Build frontend
        run: npm run build
        working-directory: ecommerce-fe
